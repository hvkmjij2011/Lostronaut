[package]
name = "lostranout"
version = "0.1.0"
edition = "2021"
description = "Lostranout - voxel gezegenlerde hayatta kalma ve yıldızlararası roket inşa oyunu"

[lib]
name = "lostranout"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "lostranout"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.16.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded",
    "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render",
    "bevy_state", "bevy_window", "bevy_winit", "bevy_log", "png",
] }
bevy_egui = { version = "0.34", default-features = false, features = ["render", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.16.1", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.16.1", default-features = false, features = ["android-native-activity"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.android]
package = "org.lostranout.game"
build_targets = ["aarch64-linux-android"]
apk_name = "lostranout"
assets = "assets"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33

[package.metadata.android.application]
label = "Lostranout"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = false

# Debug keystore so that `cargo apk build --release` produces an installable APK.
# Replace with your own keystore before publishing.
[package.metadata.android.signing.release]
path = "android/debug.keystore"
keystore_password = "android"
